    commands:
    - status
    - whoami
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  generation:
    purpose: Generate remote content, start AI work, or consume quota.
    commands:
    - ask
    - image
    - new
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - send
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - deep-research-result
    - detail
    - history
    - project-list
    - read
  write-actions:
    purpose: Change remote service state.
    commands:
    - model
    - project-file-add
