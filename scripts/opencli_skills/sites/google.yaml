schema_version: 2
catalog_version: opencli-1.8.6
site: google
display_name: Google
domains:
- google.com
aliases: []
terminal: operation
operations:
  public-data:
    purpose: Read low-risk public data without browser state.
    commands:
    - news
    - suggest
    - trends
  web-search:
    purpose: Read browser-rendered web search results.
    commands:
    - search
commands:
  news:
    operation: public-data
    semantic_effect: public_read
    risk: low
    auth: none
    transport: public_http
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
    arg_overrides:
      limit:
        minimum: 1
        maximum: 100
      lang:
        pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]+)?$
      region:
        pattern: ^[A-Z]{2}$
  search:
    operation: web-search
    semantic_effect: public_read
    risk: low
    auth: none
    transport: browser_dom
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
    arg_overrides:
      limit:
        minimum: 1
        maximum: 100
  suggest:
    operation: public-data
    semantic_effect: public_read
    risk: low
    auth: none
    transport: public_http
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  trends:
    operation: public-data
    semantic_effect: public_read
    risk: low
    auth: none
    transport: public_http
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
    arg_overrides:
      limit:
        minimum: 1
        maximum: 100
      region:
        pattern: ^[A-Z]{2}$
