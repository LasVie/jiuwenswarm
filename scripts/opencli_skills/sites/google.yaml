schema_version: 1
catalog_version: opencli-1.8.6
site: google
display_name: Google
domains:
- google.com
aliases: []
terminal: operation
review:
  status: reviewed
  owner: agent-a
  notes: Initial conservative policy; non-public-read commands remain fail-closed until their review wave.
operations:
  public-data:
    purpose: Read low-risk public data without browser state.
    commands:
    - news
    - suggest
    - trends
  web-search:
    purpose: Read browser-rendered web search results.
    commands:
    - search
commands:
  news:
    operation: public-data
    semantic_effect: public_read
    risk: low
    auth: none
    transport: public_http
    execution_state: enabled
    executor: generic_manifest_read
    confirmation: none
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
    arg_overrides:
      limit:
        minimum: 1
        maximum: 100
      lang:
        pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]+)?$
      region:
        pattern: ^[A-Z]{2}$
  search:
    operation: web-search
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_dom
    execution_state: disabled
    executor: none
    confirmation: unsupported
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private content
    - account identifiers
    notes: ''
    arg_overrides:
      limit:
        minimum: 1
        maximum: 100
  suggest:
    operation: public-data
    semantic_effect: public_read
    risk: low
    auth: none
    transport: public_http
    execution_state: enabled
    executor: generic_manifest_read
    confirmation: none
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  trends:
    operation: public-data
    semantic_effect: public_read
    risk: low
    auth: none
    transport: public_http
    execution_state: enabled
    executor: generic_manifest_read
    confirmation: none
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
    arg_overrides:
      limit:
        minimum: 1
        maximum: 100
      region:
        pattern: ^[A-Z]{2}$
