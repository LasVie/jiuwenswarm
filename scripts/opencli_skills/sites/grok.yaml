schema_version: 2
catalog_version: opencli-1.8.6
site: grok
display_name: Grok
domains:
- grok.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - status
    - whoami
  account-actions:
    purpose: Change reversible account relationship or saved state.
    commands:
    - pin
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  destructive-actions:
    purpose: Delete, remove, revoke, or perform administrative changes.
    commands:
    - delete
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - export-all
  generation:
    purpose: Generate remote content, start AI work, or consume quota.
    commands:
    - ask
    - image
    - new
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - send
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - detail
    - export
    - history
    - read
  write-actions:
    purpose: Change remote service state.
    commands:
    - unpin
commands:
  ask:
    operation: generation
    semantic_effect: quota_consumption
    risk: high
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  delete:
    operation: destructive-actions
    semantic_effect: destructive_or_admin
    risk: critical
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  detail:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private conversation content
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 grok/detail.js; reads authenticated or session-scoped content that can expose private account data.'
  export:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs:
    - workspace-relative output
    sensitive_output:
    - private conversation metadata
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 grok/export.js; returns private conversation metadata as command output and does not create a local export file.'
