schema_version: 1
catalog_version: opencli-1.8.6
site: instagram
display_name: Instagram
domains:
- instagram.com
- www.instagram.com
aliases: []
terminal: operation
review:
  status: generated
  owner: agent-c
  notes: Initial conservative policy; non-public-read commands remain fail-closed until their review wave.
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - profile
    - whoami
  account-actions:
    purpose: Change reversible account relationship or saved state.
    commands:
    - follow
    - like
    - save
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  destructive-actions:
    purpose: Delete, remove, revoke, or perform administrative changes.
    commands:
    - collection-delete
    - unfollow
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - comment
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - explore
    - followers
    - following
    - saved
    - search
    - user
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - collection-create
    - post
  write-actions:
    purpose: Change remote service state.
    commands:
    - note
    - reel
    - story
    - unlike
    - unsave
