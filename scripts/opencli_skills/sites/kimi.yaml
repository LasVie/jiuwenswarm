schema_version: 2
catalog_version: opencli-1.8.6
site: kimi
display_name: Kimi
domains:
- kimi.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - account
    - cookies
    - idb-list
    - status
    - storage-get
    - storage-keys
    - usage
    - whoami
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  discovery:
    purpose: Search, browse, recommend, or discover site content.
    commands:
    - templates
  generation:
    purpose: Generate remote content, start AI work, or consume quota.
    commands:
    - ask
    - new
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - copy-message
    - send
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - detail
    - history
    - read
  write-actions:
    purpose: Change remote service state.
    commands:
    - dismiss-banner
    - history-rename
    - mode
    - model
    - react
    - regenerate
    - settings
    - share
    - sidebar-toggle
    - sign-out
    - upgrade
    - view-all-history
