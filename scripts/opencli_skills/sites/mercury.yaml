schema_version: 2
catalog_version: opencli-1.8.6
site: mercury
display_name: Mercury
domains:
- app.mercury.com
aliases: []
terminal: operation
operations:
  financial-actions:
    purpose: Financial or reimbursement state changes.
    commands:
    - reimbursement-draft
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - reimbursement-plan
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - check-login
commands:
  check-login:
    operation: account
    semantic_effect: private_account_read
    risk: medium
    auth: optional
    transport: browser_dom
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 mercury/check-login.js; reads current browser-session authentication state without changing it.'
  reimbursement-draft:
    operation: financial-actions
    semantic_effect: financial_write
    risk: critical
    auth: required
    transport: browser_dom
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  reimbursement-plan:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: local
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private content
    - account identifiers
    notes: ''
