schema_version: 2
catalog_version: opencli-1.8.6
site: midjourney
display_name: Midjourney
domains:
- www.midjourney.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - whoami
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  generation:
    purpose: Generate remote content, start AI work, or consume quota.
    commands:
    - generate
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - history
    - quota
    - settings
    - status
  write-actions:
    purpose: Change remote service state.
    commands:
    - action
    - describe
