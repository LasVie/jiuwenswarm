    sensitive_output: []
    notes: ''
  current:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    execution_state: disabled
    executor: none
    confirmation: unsupported
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private notebook content
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 notebooklm/current.js; reads authenticated notebook content or metadata without changing remote notebook state.'
