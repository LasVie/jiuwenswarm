schema_version: 1
catalog_version: opencli-1.8.6
site: notebooklm
display_name: Notebooklm
domains:
- google.com
- notebooklm.google.com
aliases: []
terminal: operation
review:
  status: generated
  owner: agent-b
  notes: Initial conservative policy; non-public-read commands remain fail-closed until their review wave.
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - status
    - whoami
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  generation:
    purpose: Generate remote content, start AI work, or consume quota.
    commands:
    - generate-audio
    - generate-slides
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - current
    - get
    - history
    - list
    - note-list
    - notes-get
    - open
    - source-fulltext
    - source-get
    - source-guide
    - source-list
    - summary
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - create
  write-actions:
    purpose: Change remote service state.
    commands:
    - add-source
    - write-note
commands:
  add-source:
    operation: write-actions
    semantic_effect: reversible_remote_write
    risk: high
    auth: required
    transport: browser_cookie
    execution_state: disabled
    executor: none
    confirmation: unsupported
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  create:
    operation: publishing
    semantic_effect: public_write
    risk: high
    auth: required
    transport: browser_cookie
    execution_state: disabled
    executor: none
    confirmation: unsupported
    fallback_before: browser_agent
    fallback_after: none
