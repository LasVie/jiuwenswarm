schema_version: 2
catalog_version: opencli-1.8.6
site: paperreview
display_name: Paperreview
domains:
- paperreview.ai
aliases: []
terminal: operation
operations:
  private-content:
    purpose: Read private review content addressed by a bearer capability token.
    commands:
    - review
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - submit
  write-actions:
    purpose: Change remote service state.
    commands:
    - feedback
commands:
  feedback:
    operation: write-actions
    semantic_effect: reversible_remote_write
    risk: high
    auth: none
    transport: public_http
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  review:
    operation: private-content
    semantic_effect: private_content_read
    risk: high
    auth: required
    transport: public_http
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - review token
    - private review content
    notes: Requires a bearer capability token; public HTTP transport does not make the review data public.
  submit:
    operation: publishing
    semantic_effect: public_write
    risk: high
    auth: none
    transport: public_http
    fallback_before: browser_agent
    fallback_after: none
    file_inputs:
    - workspace-relative input when declared by adapter
    file_outputs: []
    sensitive_output: []
    notes: ''
