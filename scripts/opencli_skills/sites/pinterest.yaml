schema_version: 2
catalog_version: opencli-1.8.6
site: pinterest
display_name: Pinterest
domains:
- www.pinterest.com
aliases: []
terminal: operation
operations:
  account-actions:
    purpose: Change reversible account relationship or saved state.
    commands:
    - save
  destructive-actions:
    purpose: Delete, remove, revoke, or perform administrative changes.
    commands:
    - board-delete
    - board-section-delete
    - pin-delete
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - board-pins
    - board-sections
    - pin
    - search-boards
    - search-pins
    - search-users
    - user
    - user-boards
    - user-pins
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - board-create
    - board-section-create
    - board-update
    - pin-create
    - pin-update
