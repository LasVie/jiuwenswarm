schema_version: 2
catalog_version: opencli-1.8.6
site: rednote
display_name: Rednote
domains:
- rednote.com
- www.rednote.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - whoami
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  content:
    purpose: Read site content and metadata.
    commands:
    - comments
    - note
    - user
  discovery:
    purpose: Search, browse, recommend, or discover site content.
    commands:
    - search
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - feed
    - notifications
commands:
  comments:
    operation: content
    semantic_effect: public_read
    risk: low
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  download:
