schema_version: 1
catalog_version: opencli-1.8.6
site: slock
display_name: Slock
domains:
- app.slock.ai
aliases: []
terminal: operation
review:
  status: generated
  owner: agent-a
  notes: Browser-backed reads source-reviewed; remaining disabled capabilities pending review application.
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - whoami
  account-actions:
    purpose: Change reversible account relationship or saved state.
    commands:
    - bookmark-add
    - thread-follow
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  destructive-actions:
    purpose: Delete, remove, revoke, or perform administrative changes.
    commands:
    - bookmark-remove
    - reaction-remove
    - task-delete
    - thread-unfollow
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - attachment-download
    - channel-archive
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - message-send
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - attachment-url
    - bookmark-list
    - channel-files
    - channel-info
    - channel-list
    - channel-members
    - dm-list
    - inbox
    - message-read
    - message-search
    - server-list
    - task-get
    - task-list
    - task-list-server
    - thread-list
    - unread-summary
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - attachment-upload
    - channel-create
    - task-create
  write-actions:
    purpose: Change remote service state.
    commands:
    - channel-join
    - channel-leave
    - channel-mark
    - channel-unarchive
    - inbox-done
    - inbox-read-all
    - reaction-add
    - server-use
    - task-claim
    - task-convert
    - task-status
    - task-unclaim
    - thread-done
    - thread-undone
