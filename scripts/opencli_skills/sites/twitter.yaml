schema_version: 1
catalog_version: opencli-1.8.6
site: twitter
display_name: Twitter
domains:
- x.com
aliases: []
terminal: operation
review:
  status: generated
  owner: agent-b
  notes: Initial conservative policy; non-public-read commands remain fail-closed until their review wave.
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - profile
    - whoami
  account-actions:
    purpose: Change reversible account relationship or saved state.
    commands:
    - bookmark
    - follow
    - follow-batch
    - like
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  destructive-actions:
    purpose: Delete, remove, revoke, or perform administrative changes.
    commands:
    - block
    - delete
    - list-delete
    - list-remove
    - list-remove-batch
    - unfollow
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - hide-reply
    - reply
    - reply-dm
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - article
    - bookmark-folder
    - bookmark-folders
    - bookmarks
    - device-follow
    - followers
    - following
    - likes
    - list-tweets
    - lists
    - notifications
    - search
    - thread
    - timeline
    - trending
    - tweets
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - list-create
    - post
  write-actions:
    purpose: Change remote service state.
    commands:
    - accept
    - list-add
    - list-add-batch
    - quote
    - retweet
    - unblock
    - unbookmark
    - unlike
    - unretweet
