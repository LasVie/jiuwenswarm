schema_version: 2
catalog_version: opencli-1.8.6
site: twitter
display_name: Twitter
domains:
- x.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - whoami
  account-actions:
    purpose: Change reversible account relationship or saved state.
    commands:
    - bookmark
    - follow
    - follow-batch
    - like
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  destructive-actions:
    purpose: Delete, remove, revoke, or perform administrative changes.
    commands:
    - block
    - delete
    - list-delete
    - list-remove
    - list-remove-batch
    - unfollow
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  messaging:
    purpose: Send messages, replies, comments, invitations, or contacts.
    commands:
    - hide-reply
    - reply
    - reply-dm
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - bookmark-folder
    - bookmark-folders
    - bookmarks
    - device-follow
    - likes
    - list-tweets
    - lists
    - notifications
    - timeline
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - list-create
    - post
  write-actions:
    purpose: Change remote service state.
    commands:
    - accept
    - list-add
    - list-add-batch
    - quote
    - retweet
    - unblock
    - unbookmark
    - unlike
    - unretweet
  content:
    purpose: Read one public item, record, page, or resource.
    commands:
    - article
    - profile
    - thread
    - tweets
  discovery:
    purpose: Search, browse, recommend, or discover site content.
    commands:
    - followers
    - following
    - search
    - trending
commands:
  accept:
    operation: write-actions
    semantic_effect: reversible_remote_write
    risk: high
    auth: required
    transport: browser_dom
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
  article:
    operation: content
    semantic_effect: public_read
    risk: low
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: 'Source-audited against OpenCLI 1.8.6 twitter/article.js; returns public long-form content as Markdown command output without creating a local file.'
