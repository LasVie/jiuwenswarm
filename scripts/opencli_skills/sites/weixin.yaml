schema_version: 2
catalog_version: opencli-1.8.6
site: weixin
display_name: Weixin
domains:
- mp.weixin.qq.com
- weixin.sogou.com
aliases: []
terminal: operation
operations:
  file-operations:
    purpose: Create or download workspace files.
    commands:
    - download
  discovery:
    purpose: Search, browse, recommend, or discover site content.
    commands:
    - search
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - drafts
  publishing:
    purpose: Publish, create, edit, or upload remote content.
    commands:
    - create-draft
commands:
  create-draft:
    operation: publishing
    semantic_effect: public_write
    risk: high
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs:
    - workspace-relative input when declared by adapter
    file_outputs: []
    sensitive_output: []
    notes: ''
  download:
    operation: file-operations
    semantic_effect: local_write
    risk: high
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs:
    - workspace-relative output
    sensitive_output: []
    notes: ''
  drafts:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private content
    - account identifiers
    notes: ''
  search:
    operation: discovery
    semantic_effect: public_read
    risk: low
    auth: none
    transport: browser_dom
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: ''
