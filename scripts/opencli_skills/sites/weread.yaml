schema_version: 2
catalog_version: opencli-1.8.6
site: weread
display_name: Weread
domains:
- weread.qq.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - whoami
  analytics:
    purpose: Read aggregate metrics, trends, or rankings.
    commands:
    - ranking
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  discovery:
    purpose: Search, browse, recommend, or discover site content.
    commands:
    - book-search
    - search
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - ai-outline
    - highlights
    - notebooks
    - notes
    - shelf
  content:
    purpose: Read one public item, record, page, or resource.
    commands:
    - book
commands:
  ai-outline:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - licensed book-derived content
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 weread/ai-outline.js; retrieves an existing account-accessible outline and does not request new AI generation or consume generation quota.'
  book:
    operation: content
    semantic_effect: public_read
    risk: low
    auth: optional
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: 'Source-audited against OpenCLI 1.8.6 weread/book.js; reads public site content through the browser session. Login may affect availability, but no account-private fields are intended.'
