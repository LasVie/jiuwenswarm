schema_version: 2
catalog_version: opencli-1.8.6
site: xiaoe
display_name: Xiaoe
domains:
- h5.xet.citv.cn
- study.xiaoe-tech.com
- xiaoe-tech.com
aliases: []
terminal: operation
operations:
  account:
    purpose: Read account identity or account-scoped metadata.
    commands:
    - whoami
  authentication:
    purpose: Open, change, or clear an authenticated browser session.
    commands:
    - login
  private-content:
    purpose: Read content that depends on an authenticated account.
    commands:
    - catalog
    - content
    - courses
    - play-url
  content:
    purpose: Read one public item, record, page, or resource.
    commands:
    - detail
commands:
  catalog:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private course content
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 xiaoe/catalog.js; reads authenticated or session-scoped content that can expose private account data.'
  content:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private course content
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 xiaoe/content.js; reads authenticated or session-scoped content that can expose private account data.'
  courses:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - purchase history
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 xiaoe/courses.js; reads authenticated or session-scoped content that can expose private account data.'
  detail:
    operation: content
    semantic_effect: public_read
    risk: low
    auth: optional
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: browser_agent
    file_inputs: []
    file_outputs: []
    sensitive_output: []
    notes: 'Source-audited against OpenCLI 1.8.6 xiaoe/detail.js; reads public site content through the browser session. Login may affect availability, but no account-private fields are intended.'
  login:
    operation: authentication
    semantic_effect: auth_session_change
    risk: high
    auth: interactive
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output: []
