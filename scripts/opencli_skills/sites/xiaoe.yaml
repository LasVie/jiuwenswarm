  play-url:
    operation: private-content
    semantic_effect: private_content_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - private course media URL
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 xiaoe/play-url.js; reads account-authorized media playback URLs that can be signed or access-scoped and must not be persisted or shared.'
  whoami:
    operation: account
    semantic_effect: private_account_read
    risk: medium
    auth: required
    transport: browser_cookie
    fallback_before: browser_agent
    fallback_after: none
    file_inputs: []
    file_outputs: []
    sensitive_output:
    - account identifiers
    notes: 'Source-audited against OpenCLI 1.8.6 xiaoe/auth.js; reads current browser-session or account-scoped metadata.'
