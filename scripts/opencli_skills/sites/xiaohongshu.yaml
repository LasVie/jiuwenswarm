    commands:
    - creator-note-detail
    - creator-notes
    - creator-notes-summary
    - creator-profile
    - creator-stats
  discovery:
    purpose: Search, browse, recommend, or discover site content.
    commands:
    - ask
    - feed
    - search
  drafts:
    purpose: Read or change local or remote draft state.
    commands:
    - draft-clear
    - draft-delete
    - draft-open
    - drafts
  notes:
    purpose: Read Xiaohongshu note and notification data.
    commands:
    - comments
    - download
    - liked
